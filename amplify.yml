version: 1
# Amplify app dkuj4lgqcrq22: connected Production branch is `dev`.
# `main` is not connected — pushing main does not update this host.
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
        - npm test
        - export VITE_APP_COMMIT="${AWS_COMMIT_ID:-local}"
        - export VITE_APP_BRANCH="${AWS_BRANCH:-unknown}"
        - export VITE_APP_DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        - node scripts/write-release-info.mjs
    build:
      commands:
        - export VITE_APP_COMMIT="${AWS_COMMIT_ID:-local}"
        - export VITE_APP_BRANCH="${AWS_BRANCH:-unknown}"
        - export VITE_APP_DEPLOYED_AT="${VITE_APP_DEPLOYED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
