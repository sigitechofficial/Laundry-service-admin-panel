# Admin UI is hosted on AWS Amplify (branches: dev = staging, main = prod).
# This workflow is the leftover VPS/Apache path — keep DEPLOY_ADMIN_TO_VPS=false
# unless you intentionally serve admin from the VPS again.
name: Deploy Laundry Admin

on:
  push:
    # Amplify watches `dev` + `main`. These names only matter if VPS deploy is re-enabled.
    branches: [dev, stage, main]
  workflow_dispatch:

concurrency:
  group: laundry-admin-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Admin deploy gate (Amplify vs VPS)
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: decide
        run: |
          set -euo pipefail
          # ============================================================
          # Admin live host = AWS Amplify
          #   Amplify branch `dev`  → staging admin
          #   Amplify branch `main` → production admin
          # Leave DEPLOY_ADMIN_TO_VPS=false so GitHub does not also rsync Apache.
          # ============================================================
          DEPLOY_ADMIN_TO_VPS=false

          # ============================================================
          # TOGGLE: auto-deploy VPS prod on `git push origin main`
          # (ignored while DEPLOY_ADMIN_TO_VPS=false)
          # ============================================================
          AUTO_DEPLOY_PROD_ON_PUSH_MAIN=false

          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          OK=false
          if [ "$DEPLOY_ADMIN_TO_VPS" = "true" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then OK=true; fi
            # Staging-like branches if you ever re-enable VPS admin
            if [ "$REF" = "dev" ] || [ "$REF" = "stage" ]; then OK=true; fi
            if [ "$REF" = "main" ] && [ "$AUTO_DEPLOY_PROD_ON_PUSH_MAIN" = "true" ]; then OK=true; fi
          fi
          echo "deploy=$OK" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_ADMIN_TO_VPS=$DEPLOY_ADMIN_TO_VPS AUTO_DEPLOY_PROD_ON_PUSH_MAIN=$AUTO_DEPLOY_PROD_ON_PUSH_MAIN ref=$REF event=$EVENT deploy=$OK"
          if [ "$OK" != "true" ]; then
            echo "Skipping VPS admin deploy. Amplify builds: push to \`dev\` (stage admin) or \`main\` (prod admin). Flip DEPLOY_ADMIN_TO_VPS only if you need Apache again."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Resolve API URL for build
        id: api
        run: |
          # Amplify/VPS: main = prod API; dev|stage = stage API
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "url=${LAUNDRY_API_BASE_URL_PROD:-https://prodlaundry.sigisolutions.net/}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${LAUNDRY_API_BASE_URL_STAGE:-https://stagelaundry.sigisolutions.net/}" >> "$GITHUB_OUTPUT"
          fi
        env:
          LAUNDRY_API_BASE_URL_PROD: ${{ secrets.LAUNDRY_API_BASE_URL_PROD }}
          LAUNDRY_API_BASE_URL_STAGE: ${{ secrets.LAUNDRY_API_BASE_URL_STAGE }}
      - name: Build
        env:
          CI: true
          LAUNDRY_API_BASE_URL: ${{ steps.api.outputs.url }}
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_APP_BRANCH: ${{ github.ref_name }}
          VITE_APP_DEPLOYED_AT: ${{ github.event.head_commit.timestamp }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          export VITE_APP_DEPLOYED_AT="${VITE_APP_DEPLOYED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          npm run write:release
          npm run build
          # Ensure dist has the same fingerprint Amplify would publish
          cp -f public/release.json dist/release.json
          cat dist/release.json
      - name: Package
        run: |
          test -f dist/index.html
          test -f dist/release.json
          tar -czf laundry-admin-release.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: laundry-admin-release
          path: laundry-admin-release.tar.gz
          retention-days: 7

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: laundry-admin-release
      - name: Resolve paths
        id: target
        env:
          ADMIN_DEPLOY_PATH_PROD: ${{ secrets.ADMIN_DEPLOY_PATH_PROD }}
          ADMIN_DEPLOY_PATH_STAGE: ${{ secrets.ADMIN_DEPLOY_PATH_STAGE }}
          ADMIN_APP_URL_PROD: ${{ secrets.ADMIN_APP_URL_PROD }}
          ADMIN_APP_URL_STAGE: ${{ secrets.ADMIN_APP_URL_STAGE }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "live_path=${ADMIN_DEPLOY_PATH_PROD:-/home/sigisolutions/adminlaundry.sigisolutions.net}" >> "$GITHUB_OUTPUT"
            echo "app_url=${ADMIN_APP_URL_PROD:-https://adminlaundry.sigisolutions.net/}" >> "$GITHUB_OUTPUT"
            echo "deploy_root=/home/sigisolutions/deployments/laundry-admin" >> "$GITHUB_OUTPUT"
          else
            # Prefer a real stage docroot secret; do not default to the same path as prod.
            echo "live_path=${ADMIN_DEPLOY_PATH_STAGE:-/home/sigisolutions/stagelaundryadmin.sigisolutions.net}" >> "$GITHUB_OUTPUT"
            echo "app_url=${ADMIN_APP_URL_STAGE:-https://stagelaundryadmin.sigisolutions.net/}" >> "$GITHUB_OUTPUT"
            echo "deploy_root=/home/sigisolutions/deployments/laundry-admin-stage" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          # Prefer SSH_* (same as API repo); fall back to legacy SERVER_* secrets.
          host: ${{ secrets.SSH_HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER || secrets.SERVER_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}
          timeout: 60s
          source: laundry-admin-release.tar.gz
          target: ${{ steps.target.outputs.deploy_root }}/incoming/
          overwrite: true
      - name: Promote release
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_ID: ${{ github.sha }}
          LIVE_PATH: ${{ steps.target.outputs.live_path }}
          APP_URL: ${{ steps.target.outputs.app_url }}
          DEPLOY_ROOT: ${{ steps.target.outputs.deploy_root }}
        with:
          host: ${{ secrets.SSH_HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER || secrets.SERVER_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: RELEASE_ID,LIVE_PATH,APP_URL,DEPLOY_ROOT
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_ROOT"/{incoming,releases,backups,logs} "$LIVE_PATH"
            IN="$DEPLOY_ROOT/incoming/laundry-admin-release.tar.gz"
            if [ ! -f "$IN" ]; then
              IN="$(find "$DEPLOY_ROOT/incoming" -name 'laundry-admin-release.tar.gz' | head -1)"
            fi
            test -f "$IN"
            RELEASE_PATH="$DEPLOY_ROOT/releases/$RELEASE_ID"
            BACKUP_FILE="$DEPLOY_ROOT/backups/backup-$(date -u +%Y%m%d%H%M%S).tar.gz"
            rm -rf "$RELEASE_PATH"; mkdir -p "$RELEASE_PATH"
            tar -xzf "$IN" -C "$RELEASE_PATH"
            test -f "$RELEASE_PATH/index.html"
            if [ -d "$LIVE_PATH" ] && [ "$(ls -A "$LIVE_PATH" 2>/dev/null | head -1)" ]; then
              tar --exclude=.well-known --exclude=cgi-bin -czf "$BACKUP_FILE" -C "$LIVE_PATH" . || true
            fi
            rsync -az --delete \
              --exclude=".htaccess" --exclude=".well-known" --exclude="cgi-bin" \
              "$RELEASE_PATH/" "$LIVE_PATH/"
            if [ ! -f "$LIVE_PATH/.htaccess" ]; then
              cat > "$LIVE_PATH/.htaccess" <<'HT'
            <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /
              RewriteCond %{REQUEST_FILENAME} -f [OR]
              RewriteCond %{REQUEST_FILENAME} -d
              RewriteRule ^ - [L]
              RewriteRule ^ index.html [L]
            </IfModule>
            HT
            fi
            echo "$RELEASE_ID" > "$DEPLOY_ROOT/current-release.txt"
            curl -fsS --retry 3 "$APP_URL" >/dev/null
            ls -1dt "$DEPLOY_ROOT/releases"/* 2>/dev/null | tail -n +11 | xargs -r rm -rf
            ls -1t "$DEPLOY_ROOT/backups"/backup-*.tar.gz 2>/dev/null | tail -n +11 | xargs -r rm -f
            echo "Admin deploy complete $RELEASE_ID"
